name: Build and Push Docker Images

on:
  push:
    branches: [ main, production ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: Build and push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: shortlink-api
            context: .
            dockerfile: cmd/shortlink-api/Dockerfile
            image: shortlink-api
          - name: redirector
            context: .
            dockerfile: cmd/redirector/Dockerfile
            image: shortlink-redirector
          - name: click-collector
            context: .
            dockerfile: cmd/click-collector/Dockerfile
            image: shortlink-collector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,priority=100
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:buildcache,mode=max


