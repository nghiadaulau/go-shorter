name: Build and Push Docker Images

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  build-and-push:
    name: Build and push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: shortlink-api
            context: .
            dockerfile: cmd/shortlink-api/Dockerfile
            image: shortlink-api
          - name: redirector
            context: .
            dockerfile: cmd/redirector/Dockerfile
            image: shortlink-redirector
          - name: click-collector
            context: .
            dockerfile: cmd/click-collector/Dockerfile
            image: shortlink-collector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tags (use git tag as image tag)
        id: tags
        run: |
          USER="${{ secrets.DOCKER_USERNAME }}"
          IMAGE="${{ matrix.service.image }}"
          REPO="docker.io/${USER}/${IMAGE}"
          # Use the git tag (e.g., v1.2.3) as the image tag
          printf '%s\n' "list=${REPO}:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max


