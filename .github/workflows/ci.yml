name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Go mod download
        run: go mod download
      - name: Lint (go vet)
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build
        run: |
          go build ./cmd/shortlink-api
          go build ./cmd/redirector
          go build ./cmd/click-collector
