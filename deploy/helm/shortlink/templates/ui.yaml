apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shortlink-ui
  template:
    metadata:
      labels:
        app: shortlink-ui
    spec:
      containers:
        - name: ui
          image: {{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shortlink-ui
spec:
  selector:
    app: shortlink-ui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink-ui
spec:
  rules:
    - http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: shortlink-ui
                port:
                  number: 80
