apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: shortlink-api
  template:
    metadata:
      labels:
        app: shortlink-api
    spec:
      serviceAccountName: {{ include "go-shorter.serviceAccountName" . }}
      containers:
        - name: api
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: APP_DB_DSN
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: APP_REDIS_ADDR
              value: {{ .Values.env.REDIS_ADDR | quote }}
            - name: APP_JWT_SECRET
              value: {{ .Values.env.JWT_SECRET | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: shortlink-api
spec:
  selector:
    app: shortlink-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirector
spec:
  replicas: {{ .Values.redirector.replicaCount }}
  selector:
    matchLabels:
      app: redirector
  template:
    metadata:
      labels:
        app: redirector
    spec:
      serviceAccountName: {{ include "go-shorter.serviceAccountName" . }}
      containers:
        - name: redirector
          image: {{ .Values.redirector.image.repository }}:{{ .Values.redirector.image.tag }}
          imagePullPolicy: {{ .Values.redirector.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: APP_DB_DSN
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: APP_REDIS_ADDR
              value: {{ .Values.env.REDIS_ADDR | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: redirector
spec:
  selector:
    app: redirector
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shortlink-ui
  template:
    metadata:
      labels:
        app: shortlink-ui
    spec:
      serviceAccountName: {{ include "go-shorter.serviceAccountName" . }}
      containers:
        - name: ui
          image: {{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shortlink-ui
spec:
  selector:
    app: shortlink-ui
  ports:
    - port: 80
      targetPort: 80
{{- if .Values.collector.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: click-collector
spec:
  replicas: {{ .Values.collector.replicaCount }}
  selector:
    matchLabels:
      app: click-collector
  template:
    metadata:
      labels:
        app: click-collector
    spec:
      serviceAccountName: {{ include "go-shorter.serviceAccountName" . }}
      containers:
        - name: collector
          image: {{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          env:
            - name: APP_DB_DSN
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: APP_REDIS_ADDR
              value: {{ .Values.env.REDIS_ADDR | quote }}
{{- end }}
