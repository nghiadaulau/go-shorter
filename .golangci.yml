run:
  timeout: 3m
  tests: false

linters:
  enable:
    - govet
    - gofmt
    - goimports
    - staticcheck
    - ineffassign
    - revive
    - errcheck
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 18
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0


