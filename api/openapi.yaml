openapi: 3.1.0
info:
  title: Shortlink API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/auth/login:
    post:
      summary: Login
      responses:
        '200': { description: OK }
  /api/v1/links:
    get:
      summary: List links
      responses:
        '200': { description: OK }
    post:
      summary: Create link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_url: { type: string }
                custom_slug: { type: string }
                expire_at: { type: string, format: date-time }
                max_clicks: { type: integer }
      responses:
        '201': { description: Created }
  /api/v1/links/{slug}:
    get:
      summary: Get link
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    patch:
      summary: Update link
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    delete:
      summary: Delete link
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
  /api/v1/links/{slug}/stats:
    get:
      summary: Link stats
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: range
          schema: { type: string }
      responses:
        '200': { description: OK }
